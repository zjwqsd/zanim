<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zanim Web — Infinite Linear Algebra</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <section class="stage">
      <div class="title"><strong>Zanim Web</strong><span>infinite plane · WASM-resolved</span></div>
      <canvas id="scene"></canvas>
    </section>
    <aside>
      <h1>Linear map</h1>
      <p class="formula">A = [ a&nbsp;&nbsp;b ; c&nbsp;&nbsp;d ]</p>
      <div class="sliders">
        <label>a <input id="xx" type="range" min="-2" max="2" step="0.01" value="1"><output data-value="xx">1.00</output></label>
        <label>b <input id="xy" type="range" min="-2" max="2" step="0.01" value="0"><output data-value="xy">0.00</output></label>
        <label>c <input id="yx" type="range" min="-2" max="2" step="0.01" value="0"><output data-value="yx">0.00</output></label>
        <label>d <input id="yy" type="range" min="-2" max="2" step="0.01" value="1"><output data-value="yy">1.00</output></label>
      </div>
      <div class="det">det(A) = <strong id="det">1.000</strong></div>
      <div class="presets">
        <button data-preset="identity">Identity</button><button data-preset="rotation">Rotation</button>
        <button data-preset="stretch">Stretch</button><button data-preset="shear">Shear</button>
        <button data-preset="projection">Projection</button><button data-preset="general">General</button>
      </div>
      <p class="note">网格线段由 Zig/WASM 根据当前 viewport 解析；Canvas 只绘制返回结果。绿色 L 形与网格共享同一个矩阵。</p>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
