<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zanim Scene IR Player</title><style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui;background:#080b12;color:#eef2fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b12}.app{width:min(1200px,100vw);padding:18px}.stage{border:1px solid #263140;border-radius:12px;overflow:hidden;background:#080b12;box-shadow:0 20px 50px #0007}canvas{display:block;width:100%;aspect-ratio:16/9}.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-top:12px}button{background:#17243a;border:1px solid #345b93;color:#dbe9ff;padding:8px 14px;border-radius:8px}input{width:100%}.meta{font:12px ui-monospace,monospace;color:#91a0b9;margin-top:8px}</style></head><body><main class="app"><div class="stage"><canvas id="canvas"></canvas></div><div class="controls"><button id="play">Play</button><input id="time" type="range" min="0" max="1" step="0.001" value="0"><code id="readout">0.00</code></div><div class="meta" id="meta">loading Scene IR…</div></main><script type="module" src="./main.js"></script></body></html>
