<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zanim Web Gallery</title><link rel="stylesheet" href="./style.css"></head><body>
<main><header><div><strong>Zanim Web</strong><span>native browser animation runtime</span></div><select id="demo"></select></header><section class="stage"><canvas id="scene"></canvas></section><footer><button id="play">Play</button><input id="scrub" type="range" min="0" step="0.001" value="0"><code id="time"></code><span id="status"></span></footer></main>
<script>window.__zanimErrors=[];addEventListener("error",e=>{window.__zanimErrors.push(String(e.message||e.error));document.documentElement.dataset.zanimError=window.__zanimErrors.join(" | ")});addEventListener("unhandledrejection",e=>{window.__zanimErrors.push(String(e.reason));document.documentElement.dataset.zanimError=window.__zanimErrors.join(" | ")});</script><script type="module" src="./main.js"></script></body></html>
