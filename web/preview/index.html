<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zanim Web Preview</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;--bg:#080b12;--panel:#0e141d;--line:#243041;--muted:#91a0b9;--text:#eef2fa;--accent:#79a7ff;--warn:#f3c86c;--good:#7ce2ac}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.app{min-height:100vh;display:flex;flex-direction:column}.stage-wrap{flex:1;min-height:320px;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at center,#182131 0,#080b12 72%)}.stage{position:relative;width:min(100%,1280px);border:1px solid var(--line);background:#080b12;box-shadow:0 18px 48px #0008}.stage canvas{display:block;width:100%;aspect-ratio:16/9}.error{display:none;position:absolute;inset:12px;overflow:auto;background:#170d12e8;border:1px solid #63333d;border-radius:8px;padding:12px;color:#ffb4be;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap}.error.visible{display:block}.controls{padding:10px 12px;border-top:1px solid var(--line);background:#0d131c}.transport{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}button{background:#17243a;border:1px solid #345b93;color:#dbe9ff;min-height:34px;padding:0 12px;border-radius:7px;cursor:pointer}button:hover{background:#20314b}button:disabled{opacity:.45;cursor:not-allowed}input[type=range]{width:100%;accent-color:var(--accent)}.readout{font:12px ui-monospace,monospace;color:var(--muted);font-variant-numeric:tabular-nums}.status{margin-top:7px;color:var(--muted);font-size:12px}.timeline{border-top:1px solid var(--line);background:var(--panel);padding-bottom:10px;overflow:auto;max-height:42vh}.timeline-head{position:sticky;left:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#101722}.timeline-head-title{font-size:12px;color:#cbd7e8}.timeline-head button{min-height:28px;padding:0 9px;font-size:11px}.timeline-rows{min-width:920px}.timeline-row{display:grid;grid-template-columns:190px minmax(680px,1fr);border-bottom:1px solid #18222f}.track-label{position:sticky;left:0;z-index:8;display:flex;align-items:center;gap:7px;min-width:0;padding:0 10px;background:#101722;border-right:1px solid var(--line);color:#cbd7e8}.axis-row{border-bottom:1px solid var(--line)}.axis-label{height:28px;background:#0d131c}.track{position:relative;min-width:680px}.axis{height:28px;background:#0c121b}.tick{position:absolute;top:0;bottom:0;width:1px;background:#263245}.tick span{position:absolute;top:6px;left:5px;color:#718099;font:10px ui-monospace,monospace;white-space:nowrap}.event-track{background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#151f2b 30px);overflow:hidden}.event-track.overview{background:#0b1119}.event-track.overview .timeline-event.span{font-weight:600}.total-label{border:0;border-radius:0;min-height:34px;justify-content:flex-start;text-align:left}.total-label:hover{background:#17243a}.caret{width:12px;color:#8fa7c7}.object-row .track-label{min-height:34px}.object-label{font-size:12px}.branch{color:#596b82}.object-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.timeline-event{position:absolute;height:21px;min-height:0;padding:0 7px;border-radius:4px;border:1px solid #38547a;background:#17283e;color:#cfe0f7;font:10px ui-monospace,monospace;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}.timeline-event.span.active{border-color:var(--warn);background:#493819;color:#ffe7aa}.timeline-event.selected{outline:1px solid #8bb8ff;outline-offset:1px}.timeline-event.point{width:7px!important;height:7px;padding:0;border-radius:50%;transform:translate(-3px,7px);overflow:visible;background:#66758a;border-color:#8796aa}.point-label{display:none}.timeline-event.point.active .point-label,.timeline-event.point.selected .point-label{color:#ffe7aa}.timeline-event.point.action-add{background:#4c8465;border-color:var(--good)}.timeline-event.point.action-remove{background:#8b4f58;border-color:#d98a96}.timeline-event.point.passed{opacity:.9}.timeline-event.point.active,.timeline-event.point.selected{background:var(--warn);border-color:#ffe19c;opacity:1}.playhead{position:absolute;top:0;bottom:0;width:1px;background:#ffce68;box-shadow:0 0 0 1px #ffce6828;pointer-events:none;z-index:6}.playhead::before{content:'';position:absolute;top:0;left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid #ffce68}@media(max-width:760px){.stage-wrap{min-height:240px}.timeline{max-height:48vh}.transport{grid-template-columns:auto auto 1fr}.readout{grid-column:1/-1}.timeline-row{grid-template-columns:180px minmax(680px,1fr)}}
</style>
</head>
<body>
<main class="app">
  <section class="stage-wrap"><div class="stage"><canvas id="canvas"></canvas><div id="error" class="error"></div></div></section>
  <section class="controls">
    <div class="transport"><button id="play">Play</button><button id="reload">↻ Reload</button><input id="time" type="range" min="0" max="1" step="0.001" value="0"><span id="readout" class="readout">0.00</span></div>
    <div id="status" class="status">Loading Scene IR…</div>
  </section>
  <section class="timeline">
    <div class="timeline-head"><span class="timeline-head-title">Timeline</span><button id="timelineToggle" type="button">Expand</button></div>
    <div id="timelineRows" class="timeline-rows"></div>
  </section>
</main>
<script type="module" src="/preview/main.js"></script>
</body>
</html>
