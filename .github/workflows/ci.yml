name: CI

on:
  push:
  pull_request:

jobs:
  test-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: typst-community/setup-typst@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install FFmpeg and wheel repair tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg patchelf

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ffmpeg --no-progress -y

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Source checks
        shell: bash
        run: |
          uv sync --python ${{ matrix.python }}
          ./scripts/check.sh

      - name: Build platform wheel
        shell: bash
        run: uv build --wheel

      - name: Repair Linux wheel to manylinux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p repaired
          uvx auditwheel repair dist/*.whl --wheel-dir repaired
          rm dist/*.whl
          mv repaired/*.whl dist/

      - name: Clean-install wheel
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            VENV_PYTHON=.wheel-venv/Scripts/python.exe
          else
            VENV_PYTHON=.wheel-venv/bin/python
          fi
          uv venv .wheel-venv --python ${{ matrix.python }}
          uv pip install --python "$VENV_PYTHON" dist/*.whl
          "$VENV_PYTHON" -m zanim.cli --version
          "$VENV_PYTHON" -m zanim.cli info
          "$VENV_PYTHON" scripts/wheel_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ runner.os }}-py${{ matrix.python }}
          path: dist/*.whl

  release-python:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*-py3.12
          path: pypi
          merge-multiple: true

      - name: Verify tag matches wheel version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          compgen -G "pypi/zanim-${version}-*.whl" >/dev/null

      - name: Prepare GitHub release assets
        shell: bash
        run: |
          mkdir -p release
          cp pypi/*.whl release/
          cd release
          sha256sum *.whl > SHA256SUMS.txt

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
