[project]
name = "zanim"
version = "0.5.0"
description = "A Manim-style animation engine with a Python frontend and Zig core"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.3.0",
    "zstandard>=0.23",
]

[project.optional-dependencies]
examples = ["numpy>=2.0"]

[project.scripts]
zanim = "zanim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/zanim"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "numpy>=2.5.2",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
