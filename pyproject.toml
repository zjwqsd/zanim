[project]
name = "zanim"
version = "0.1.0"
description = "A Manim-style animation engine with a Python frontend and Zig core"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/zanim"]

[dependency-groups]
dev = [
    "numpy>=2.5.2",
]
